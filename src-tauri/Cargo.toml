[package]
name = "weimu"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "weimu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.52.3"
rodio = "0.22.2"
ytmapi-rs = "0.3.2"
rusty_ytdl = { git = "https://github.com/Mithronn/rusty_ytdl" }
yt-dlp = {git = "https://github.com/Guilherme-j10/yt-dlp", branch = "develop" }
